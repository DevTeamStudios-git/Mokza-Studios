<svg width="716" height="716" viewBox="0 0 716 716" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="716" height="716" rx="150" fill="#0f0c29"/>
  <rect x="38" y="38" width="640" height="640" rx="130" fill="url(#logoGradient)" filter="url(#softGlow)"/>
  <text x="358" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">Mokza</text>
  <text x="358" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">Studios</text>
  <circle cx="358" cy="540" r="24" fill="#38ef7d"/>
  <circle cx="358" cy="540" r="24" fill="#38ef7d" opacity="0.35"/>
  <rect x="54" y="54" width="608" height="608" rx="118" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>
</svg>
